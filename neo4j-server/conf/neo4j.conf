##***********************************************************
## Server configuration
##***********************************************************
dbms.active_database=fps_middleservice
dbms.windows_service_name=Neo4jServer


##***********************************************************
## Connectors configuration
##***********************************************************
dbms.connectors.default_listen_address=10.40.40.108

# Bolt connector
dbms.connector.bolt.enabled=true
dbms.connector.bolt.listen_address=:7687
dbms.connector.bolt.thread_pool_min_size=10
dbms.connector.bolt.thread_pool_max_size=200
dbms.connector.bolt.thread_pool_keep_alive=10m

# HTTP Connector. There must be exactly one HTTP connector.
dbms.connector.http.enabled=true
dbms.connector.http.listen_address=:7474


##***********************************************************
## Database configuration
##***********************************************************
dbms.db.timezone=SYSTEM


##***********************************************************
## Directories configuration
##***********************************************************
dbms.directories.tx_log=tx_log

# Force import files location using `LOAD CSV`
dbms.directories.import=import


##***********************************************************
## Index configuration
##***********************************************************
dbms.index.default_schema_provider=lucene+native-2.0


##***********************************************************
## JVM configuration
##***********************************************************
dbms.jvm.additional=-XX:+UseG1GC
dbms.jvm.additional=-XX:-OmitStackTraceInFastThrow
dbms.jvm.additional=-XX:+AlwaysPreTouch
dbms.jvm.additional=-XX:+UnlockExperimentalVMOptions
dbms.jvm.additional=-XX:+TrustFinalNonStaticFields
dbms.jvm.additional=-XX:+DisableExplicitGC
dbms.jvm.additional=-Djdk.tls.ephemeralDHKeySize=2048
dbms.jvm.additional=-Djdk.tls.rejectClientInitiatedRenegotiation=true
dbms.jvm.additional=-Dunsupported.dbms.udc.source=zip


##***********************************************************
## Logs configuration
##***********************************************************
dbms.logs.query.enabled=true
dbms.logs.query.threshold=10s


##***********************************************************
## Memory configuration
##***********************************************************
dbms.memory.heap.initial_size=6g
dbms.memory.heap.max_size=6g
dbms.memory.pagecache.size=6g


##***********************************************************
## Security configuration
##***********************************************************
dbms.security.procedures.unrestricted=apoc.*,algo.*


##***********************************************************
## Statistics configuration
##***********************************************************
dbms.index_sampling.background_enabled=true
dbms.index_sampling.sample_size_limit=67108864
dbms.index_sampling.update_percentage=5


##***********************************************************
## Transaction configuration
##***********************************************************
dbms.transaction.timeout=240s


##***********************************************************
## Transaction log configuration
##***********************************************************
dbms.tx_log.rotation.retention_policy=7 days


##***********************************************************
## UDC extension configuration
##***********************************************************
dbms.udc.enabled=false


##***********************************************************
## Monitoring configuration
##***********************************************************
metrics.enabled=true

# CSV export
metrics.csv.enabled=false


##***********************************************************
## Others configuration
##***********************************************************
browser.allow_outgoing_connections=false
apoc.import.file.enabled=true
apoc.export.file.enabled=true
browser.retain_connection_credentials=false